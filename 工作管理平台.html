<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>工作管理平台</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" />
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--bg2:#f8f8f7;--bg3:#f1efea;
  --text:#1a1a18;--text2:#6b6b67;
  --border:rgba(0,0,0,0.1);--border2:rgba(0,0,0,0.18);
  --danger:#e24b4a;--danger-bg:#fcebeb;
  --success-bg:#eaf3de;--success:#3b6d11;
  --radius:8px;--radius-lg:12px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg3);color:var(--text);font-size:14px;min-height:100vh}
.container{max-width:900px;margin:0 auto;padding:1rem}
h1{font-size:18px;font-weight:500;margin-bottom:1.5rem}
.tabs{display:flex;border-bottom:0.5px solid var(--border);margin-bottom:1.5rem}
.tab{padding:8px 18px;font-size:13px;cursor:pointer;border:none;background:none;color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-0.5px;font-family:inherit}
.tab.on{color:var(--text);border-bottom:2px solid var(--text);font-weight:500}
.sec{display:none}.sec.on{display:block}
.card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:1rem 1.25rem;margin-bottom:1rem}
label{font-size:12px;color:var(--text2);display:block;margin-bottom:3px}
input[type=text],input[type=date],select,textarea{width:100%;font-size:13px;font-family:inherit;padding:7px 10px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);outline:none}
input:focus,select:focus,textarea:focus{border-color:#888}
textarea{resize:vertical;min-height:48px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.full{grid-column:1/-1}
.btn{padding:7px 14px;border:0.5px solid var(--border2);border-radius:var(--radius);background:none;cursor:pointer;font-size:13px;font-family:inherit;color:var(--text)}
.btn:hover{background:var(--bg2)}
.btn-p{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn-p:hover{opacity:0.85}
.btn-sm{padding:3px 9px;font-size:11px}
.btn-d{color:var(--danger);border-color:#f09595}
.fe{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:1rem}
.sc{background:var(--bg2);border-radius:var(--radius);padding:10px;text-align:center}
.sn{font-size:20px;font-weight:500}.sl{font-size:11px;color:var(--text2);margin-top:1px}
.tbl{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
.tbl th{font-size:11px;font-weight:500;color:var(--text2);text-align:left;padding:6px 8px;border-bottom:0.5px solid var(--border);white-space:nowrap}
.tbl td{padding:8px 8px;border-bottom:0.5px solid var(--border);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr.done-row td{opacity:0.45}
.tbl tr.done-row .tt{text-decoration:line-through}
.nbadge{display:inline-block;font-size:11px;padding:2px 7px;border-radius:8px;white-space:nowrap;font-weight:500}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;white-space:nowrap}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.fb{padding:4px 11px;border:0.5px solid var(--border);border-radius:20px;background:none;cursor:pointer;font-size:12px;color:var(--text2);font-family:inherit}
.fb.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.cb{cursor:pointer;width:15px;height:15px}
.empty{text-align:center;padding:2rem;color:var(--text2);font-size:13px}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-nav span{font-size:15px;font-weight:500}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-dow{font-size:11px;color:var(--text2);text-align:center;padding:4px 0;font-weight:500}
.cal-day{min-height:68px;border:0.5px solid var(--border);border-radius:6px;padding:4px 5px;background:var(--bg);cursor:pointer}
.cal-day:hover{background:var(--bg2)}
.cal-day.other-month{opacity:0.35}
.cal-day.today{border-color:#888;background:var(--bg2)}
.cal-day.selected{border:1.5px solid var(--text)}
.cal-dn{font-size:11px;font-weight:500;color:var(--text2);margin-bottom:3px}
.cal-tag{font-size:10px;padding:1px 5px;border-radius:4px;margin-top:2px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day-panel{border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:1rem;margin-top:1rem}
.leave-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px;margin-top:10px}
.leave-chip{padding:6px 8px;border-radius:var(--radius);font-size:12px;text-align:center;border:0.5px solid var(--border)}
.on-leave{background:var(--danger-bg);color:#a32d2d;border-color:#f09595}
.no-leave{background:var(--bg2);color:var(--text2)}
.form-title{font-size:14px;font-weight:500;margin-bottom:12px}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px;font-size:11px;color:var(--text2);align-items:center}
.legend-dot{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:3px;vertical-align:middle}
.api-bar{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:12px 16px;margin-bottom:1.5rem;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.api-bar input{flex:1;min-width:200px}
.api-status{font-size:12px;padding:3px 10px;border-radius:10px;white-space:nowrap}
.api-ok{background:var(--success-bg);color:var(--success)}
.api-err{background:var(--danger-bg);color:var(--danger)}
.api-none{background:var(--bg2);color:var(--text2)}
@media(max-width:600px){
  .fg,.fg3{grid-template-columns:1fr}.full{grid-column:1}
  .stats{grid-template-columns:repeat(2,1fr)}
  .api-bar{flex-direction:column;align-items:stretch}
}
</style>
</head>
<body>
<div class="container">
  <h1><i class="ti ti-layout-dashboard" aria-hidden="true"></i> 工作管理平台</h1>

  <div class="api-bar">
    <i class="ti ti-cloud" style="color:var(--text2);font-size:16px" aria-hidden="true"></i>
    <label style="margin:0;white-space:nowrap;font-size:12px">Apps Script 網址</label>
    <input type="text" id="api-url" placeholder="貼上部署後的 Web App 網址..." />
    <button class="btn btn-p btn-sm" onclick="saveApiUrl()">儲存連線</button>
    <span class="api-status api-none" id="api-status">未設定</span>
  </div>

  <div class="tabs">
    <button class="tab on" onclick="switchTab('tasks',this)"><i class="ti ti-checklist"></i> 交辦事項</button>
    <button class="tab" onclick="switchTab('cal',this)"><i class="ti ti-calendar"></i> 行事曆</button>
    <button class="tab" onclick="switchTab('leave',this)"><i class="ti ti-beach"></i> 休假記錄</button>
  </div>

  <div id="sec-tasks" class="sec on">
    <div class="stats" id="task-stats"></div>
    <div class="card">
      <div class="form-title">新增交辦事項</div>
      <div class="fg">
        <div class="full"><label>事項內容</label><input type="text" id="t-title" placeholder="交辦工作描述" /></div>
        <div><label>交辦人</label><select id="t-from"></select></div>
        <div><label>受辦人</label><select id="t-to"></select></div>
        <div><label>截止日（自動同步至行事曆）</label><input type="date" id="t-due" /></div>
        <div><label>狀態</label><select id="t-status">
          <option value="todo">待處理</option><option value="wip">進行中</option><option value="done">已完成</option>
        </select></div>
      </div>
      <div class="fe"><button class="btn btn-p" onclick="addTask()"><i class="ti ti-plus"></i> 新增</button></div>
    </div>
    <div class="filters" id="task-filters"></div>
    <div style="overflow-x:auto">
      <table class="tbl">
        <thead><tr>
          <th style="width:28px"></th><th style="width:32%">事項</th>
          <th style="width:12%">交辦人</th><th style="width:12%">受辦人</th>
          <th style="width:12%">截止日</th><th style="width:11%">狀態</th><th style="width:50px"></th>
        </tr></thead>
        <tbody id="task-body"></tbody>
      </table>
    </div>
  </div>

  <div id="sec-cal" class="sec">
    <div class="card">
      <div class="form-title">新增行程</div>
      <div class="fg">
        <div class="full"><label>標題</label><input type="text" id="e-title" placeholder="行程或活動名稱" /></div>
        <div><label>日期</label><input type="date" id="e-date" /></div>
        <div><label>類型</label><select id="e-type"><option value="company">公司活動</option><option value="personal">個人行程</option></select></div>
        <div><label>相關人員</label><select id="e-person"><option value="">— 無 —</option></select></div>
        <div class="full"><label>備注</label><textarea id="e-note" placeholder="補充說明（選填）"></textarea></div>
      </div>
      <div class="fe"><button class="btn btn-p" onclick="addEvent()"><i class="ti ti-plus"></i> 新增</button></div>
    </div>
    <div class="legend">
      <span><span class="legend-dot" style="background:#eeedfe;border:1px solid #afa9ec"></span>公司活動</span>
      <span><span class="legend-dot" style="background:#eaf3de;border:1px solid #97c459"></span>個人行程</span>
      <span><span class="legend-dot" style="background:#fcebeb;border:1px solid #f09595"></span>交辦截止日</span>
      <span><span class="legend-dot" style="background:#e1f5ee;border:1px solid #5dcaa5"></span>請假</span>
    </div>
    <div class="cal-nav">
      <button class="btn btn-sm" onclick="moveMonth(-1)"><i class="ti ti-chevron-left"></i></button>
      <span id="cal-title"></span>
      <button class="btn btn-sm" onclick="moveMonth(1)"><i class="ti ti-chevron-right"></i></button>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
    <div id="day-panel" style="display:none"></div>
  </div>

  <div id="sec-leave" class="sec">
    <div class="card">
      <div class="form-title">新增請假</div>
      <div class="fg3">
        <div><label>人員</label><select id="l-person"></select></div>
        <div><label>開始日</label><input type="date" id="l-start" /></div>
        <div><label>結束日</label><input type="date" id="l-end" /></div>
        <div class="full"><label>原因（選填）</label><input type="text" id="l-note" placeholder="請假原因" /></div>
      </div>
      <div class="fe"><button class="btn btn-p" onclick="addLeave()"><i class="ti ti-plus"></i> 新增</button></div>
    </div>
    <div style="margin-bottom:10px;display:flex;align-items:center;gap:8px">
      <label style="margin:0;font-size:12px">查詢日期</label>
      <input type="date" id="l-query" style="width:160px" onchange="renderLeave()" />
    </div>
    <div id="leave-today"></div>
    <div class="card" style="margin-top:1rem">
      <div class="form-title">請假記錄</div>
      <div class="filters" id="leave-filters"></div>
      <table class="tbl">
        <thead><tr>
          <th style="width:16%">人員</th><th style="width:20%">開始</th>
          <th style="width:20%">結束</th><th style="width:12%">天數</th>
          <th>原因</th><th style="width:50px"></th>
        </tr></thead>
        <tbody id="leave-body"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const TODAY = new Date().toISOString().split('T')[0];
['t-due','e-date','l-start','l-end','l-query'].forEach(id => document.getElementById(id).value = TODAY);

const PEOPLE = [
  {id:'boss',label:'BOSS'},{id:'p1',label:'鐘佩儀'},{id:'p2',label:'柯昭欽'},
  {id:'p3',label:'邱建銘'},{id:'p4',label:'詹信元'},{id:'p5',label:'葉秋萍'},
  {id:'p6',label:'黃妤琪'},{id:'p7',label:'高世國'},{id:'p8',label:'柯勝耀'},{id:'p9',label:'柯柏良'},
];
const PCOLORS=['#EEEDFE:#3C3489','#E6F1FB:#0C447C','#EAF3DE:#27500A','#E1F5EE:#085041','#FAEEDA:#633806','#FCEBEB:#791F1F','#FBEAF0:#72243E','#F1EFE8:#444441','#E6F1FB:#185FA5','#EAF3DE:#3B6D11'];
const pById = id => PEOPLE.find(p=>p.id===id)||{label:id};
const pColor = id => { const i=PEOPLE.findIndex(p=>p.id===id); const c=(PCOLORS[i]||'#F1EFE8:#444441').split(':'); return {bg:c[0],fg:c[1]}; };

// Sheets 欄位對應
const FK = {
  task:  {id:'編號',title:'事項',from:'交辦人',to:'受辦人',due:'截止日',status:'狀態'},
  event: {id:'編號',title:'標題',date:'日期',type:'類型',person:'相關人員',note:'備注'},
  leave: {id:'編號',person:'人員',start:'開始日',end:'結束日',note:'原因'},
};
const toTask  = r => ({id:r[FK.task.id],  title:r[FK.task.title],  from:r[FK.task.from], to:r[FK.task.to],   due:r[FK.task.due],    status:r[FK.task.status]});
const toEvent = r => ({id:r[FK.event.id], title:r[FK.event.title], date:r[FK.event.date], type:r[FK.event.type], person:r[FK.event.person], note:r[FK.event.note]});
const toLeave = r => ({id:r[FK.leave.id], person:r[FK.leave.person], start:r[FK.leave.start], end:r[FK.leave.end], note:r[FK.leave.note]});
const fromTask  = o => ({[FK.task.title]:o.title,   [FK.task.from]:o.from,   [FK.task.to]:o.to,     [FK.task.due]:o.due,   [FK.task.status]:o.status});
const fromEvent = o => ({[FK.event.title]:o.title,  [FK.event.date]:o.date,  [FK.event.type]:o.type,[FK.event.person]:o.person,[FK.event.note]:o.note});
const fromLeave = o => ({[FK.leave.person]:o.person,[FK.leave.start]:o.start,[FK.leave.end]:o.end,  [FK.leave.note]:o.note});

// ── API（全用 GET）──
let API_URL = localStorage.getItem('gas-api-url')||'';
if (API_URL) { document.getElementById('api-url').value=API_URL; setApiStatus('ok'); }

function saveApiUrl(){
  API_URL = document.getElementById('api-url').value.trim();
  if (!API_URL) return;
  localStorage.setItem('gas-api-url', API_URL);
  loadAll();
}
function setApiStatus(s){
  const el=document.getElementById('api-status');
  el.className='api-status api-'+s;
  el.textContent={ok:'已連線',err:'連線失敗',none:'未設定',loading:'載入中...'}[s]||s;
}

async function gasGet(params){
  const url = API_URL + '?' + Object.entries(params).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&');
  const res = await fetch(url, {redirect:'follow', mode:'cors'});
  const text = await res.text();
  let j;
  try { j = JSON.parse(text); } catch(e) { throw new Error('回傳非 JSON: ' + text.slice(0,200)); }
  if (!j.success) throw new Error(j.error);
  return j.data;
}

let tasks=[], events=[], leaves=[];
let calYear=new Date().getFullYear(), calMonth=new Date().getMonth();
let selectedDay=null, taskFilter='all', leaveFilter='all';

async function loadAll(){
  if (!API_URL) return;
  setApiStatus('loading');
  try {
    const [rt,re,rl] = await Promise.all([
      gasGet({action:'getAll',sheet:'交辦事項'}),
      gasGet({action:'getAll',sheet:'行程'}),
      gasGet({action:'getAll',sheet:'請假'}),
    ]);
    tasks=rt.map(toTask); events=re.map(toEvent); leaves=rl.map(toLeave);
    setApiStatus('ok');
  } catch(e){
    setApiStatus('err');
    console.error(e);
    tasks  = JSON.parse(localStorage.getItem('iwd-t')||'[]');
    events = JSON.parse(localStorage.getItem('iwd-e')||'[]');
    leaves = JSON.parse(localStorage.getItem('iwd-l')||'[]');
  }
  renderTasks(); renderCal(); renderLeave();
}
function saveLocal(){
  localStorage.setItem('iwd-t',JSON.stringify(tasks));
  localStorage.setItem('iwd-e',JSON.stringify(events));
  localStorage.setItem('iwd-l',JSON.stringify(leaves));
}
if (!API_URL){
  tasks  = JSON.parse(localStorage.getItem('iwd-t')||'[]');
  events = JSON.parse(localStorage.getItem('iwd-e')||'[]');
  leaves = JSON.parse(localStorage.getItem('iwd-l')||'[]');
} else { loadAll(); }

function fillSelect(id,inclEmpty){
  const sel=document.getElementById(id); sel.innerHTML='';
  if(inclEmpty){const o=document.createElement('option');o.value='';o.textContent='— 無 —';sel.appendChild(o);}
  PEOPLE.forEach(p=>{const o=document.createElement('option');o.value=p.id;o.textContent=p.label;sel.appendChild(o);});
}
fillSelect('t-from'); fillSelect('t-to'); document.getElementById('t-to').selectedIndex=1;
fillSelect('e-person',true); fillSelect('l-person');

function switchTab(id,btn){
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('on'));
  btn.classList.add('on'); document.getElementById('sec-'+id).classList.add('on');
  if(id==='cal')renderCal(); else if(id==='leave')renderLeave(); else renderTasks();
}
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const isOD = (due,st) => due&&due<TODAY&&st!=='done';
const dateDiff = (a,b) => Math.round((new Date(b)-new Date(a))/86400000)+1;
const inRange = (d,s,e) => d>=s&&d<=e;

// ── 交辦事項 ──
async function addTask(){
  const title=document.getElementById('t-title').value.trim();
  if(!title){alert('請填寫事項內容');return;}
  const from=document.getElementById('t-from').value, to=document.getElementById('t-to').value;
  if(from===to){alert('交辦人與受辦人不能相同');return;}
  const obj={title,from,to,due:document.getElementById('t-due').value,status:document.getElementById('t-status').value};
  if(API_URL){
    try{ const r=await gasGet({action:'add',sheet:'交辦事項',row:JSON.stringify(fromTask(obj))}); obj.id=r.id; }
    catch(e){alert('新增失敗: '+e.message);return;}
  } else { obj.id=Date.now().toString(); }
  tasks.unshift(obj); saveLocal(); document.getElementById('t-title').value=''; renderTasks();
}
async function deleteTask(id){
  if(API_URL){try{await gasGet({action:'delete',sheet:'交辦事項',id})}catch(e){alert('刪除失敗');return;}}
  tasks=tasks.filter(t=>t.id!=id); saveLocal(); renderTasks();
}
async function setTaskStatus(id,val){
  const t=tasks.find(t=>t.id==id); if(!t)return;
  if(API_URL){try{await gasGet({action:'update',sheet:'交辦事項',id,row:JSON.stringify({[FK.task.status]:val})})}catch(e){}}
  t.status=val; saveLocal(); renderTasks();
}
function toggleTaskDone(id){const t=tasks.find(t=>t.id==id);if(t)setTaskStatus(id,t.status==='done'?'todo':'done');}

function renderTasks(){
  const total=tasks.length,done=tasks.filter(t=>t.status==='done').length,od=tasks.filter(t=>isOD(t.due,t.status)).length;
  document.getElementById('task-stats').innerHTML=`
    <div class="sc"><div class="sn">${total}</div><div class="sl">全部</div></div>
    <div class="sc"><div class="sn">${total-done}</div><div class="sl">未完成</div></div>
    <div class="sc"><div class="sn">${done}</div><div class="sl">已完成</div></div>
    <div class="sc"><div class="sn" style="color:${od?'var(--danger)':''}">${od}</div><div class="sl">逾期</div></div>`;
  const counts={};tasks.forEach(t=>{[t.from,t.to].forEach(r=>{counts[r]=(counts[r]||0)+1})});
  let fh=`<button class="fb${taskFilter==='all'?' on':''}" onclick="setTF('all',this)">全部 (${tasks.length})</button>`;
  PEOPLE.forEach(p=>{if(counts[p.id])fh+=`<button class="fb${taskFilter===p.id?' on':''}" onclick="setTF('${p.id}',this)">${p.label} (${counts[p.id]})</button>`;});
  document.getElementById('task-filters').innerHTML=fh;
  const list=taskFilter==='all'?tasks:tasks.filter(t=>t.from===taskFilter||t.to===taskFilter);
  const smap={todo:['#e6f1fb','#185fa5'],wip:['#faeeda','#854f0b'],done:['#eaf3de','#3b6d11']};
  document.getElementById('task-body').innerHTML=list.length?list.map(t=>{
    const pf=pById(t.from),pt=pById(t.to),cf=pColor(t.from),ct=pColor(t.to);
    const od=isOD(t.due,t.status),isDone=t.status==='done';
    const[sbg,sfg]=smap[t.status]||smap.todo;
    return `<tr class="${isDone?'done-row':''}">
      <td><input type="checkbox" class="cb" ${isDone?'checked':''} onchange="toggleTaskDone('${t.id}')" /></td>
      <td class="tt" style="word-break:break-all">${esc(t.title)}</td>
      <td><span class="nbadge" style="background:${cf.bg};color:${cf.fg}">${pf.label}</span></td>
      <td><span class="nbadge" style="background:${ct.bg};color:${ct.fg}">${pt.label}</span></td>
      <td><span style="font-size:12px;color:${od?'var(--danger)':''}">${t.due||'—'}${od?' ⚠':''}</span></td>
      <td><select style="font-size:11px;padding:2px 4px;border:0.5px solid #ccc;border-radius:6px;background:${sbg};color:${sfg};cursor:pointer;font-weight:500" onchange="setTaskStatus('${t.id}',this.value)">
        <option value="todo"${t.status==='todo'?' selected':''}>待處理</option>
        <option value="wip"${t.status==='wip'?' selected':''}>進行中</option>
        <option value="done"${t.status==='done'?' selected':''}>已完成</option>
      </select></td>
      <td><button class="btn btn-sm btn-d" onclick="deleteTask('${t.id}')"><i class="ti ti-trash"></i></button></td>
    </tr>`;
  }).join(''):`<tr><td colspan="7" class="empty">尚無事項</td></tr>`;
}
function setTF(v,btn){taskFilter=v;document.querySelectorAll('#task-filters .fb').forEach(b=>b.classList.remove('on'));btn.classList.add('on');renderTasks();}

// ── 行事曆 ──
const ETYPES={company:['#eeedfe','#3c3489','公司'],personal:['#eaf3de','#27500a','個人']};
async function addEvent(){
  const title=document.getElementById('e-title').value.trim();
  if(!title){alert('請填寫標題');return;}
  const obj={title,date:document.getElementById('e-date').value,type:document.getElementById('e-type').value,person:document.getElementById('e-person').value,note:document.getElementById('e-note').value.trim()};
  if(API_URL){try{const r=await gasGet({action:'add',sheet:'行程',row:JSON.stringify(fromEvent(obj))});obj.id=r.id;}catch(e){alert('新增失敗: '+e.message);return;}}
  else{obj.id=Date.now().toString();}
  events.push(obj); saveLocal(); document.getElementById('e-title').value=''; document.getElementById('e-note').value=''; renderCal();
}
async function deleteEvent(id){
  if(API_URL){try{await gasGet({action:'delete',sheet:'行程',id})}catch(e){alert('刪除失敗');return;}}
  events=events.filter(e=>e.id!=id); saveLocal(); renderCal();
}
function moveMonth(d){calMonth+=d;if(calMonth>11){calMonth=0;calYear++;}if(calMonth<0){calMonth=11;calYear--;}selectedDay=null;renderCal();}
function renderCal(){
  document.getElementById('cal-title').textContent=`${calYear} 年 ${calMonth+1} 月`;
  const dows=['日','一','二','三','四','五','六'];
  let html=dows.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  const first=new Date(calYear,calMonth,1).getDay();
  const days=new Date(calYear,calMonth+1,0).getDate();
  const prev=new Date(calYear,calMonth,0).getDate();
  for(let i=0;i<first;i++)html+=`<div class="cal-day other-month"><div class="cal-dn">${prev-first+1+i}</div></div>`;
  for(let d=1;d<=days;d++){
    const ds=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday=ds===TODAY,isSel=ds===selectedDay;
    const dayEvts=events.filter(e=>e.date===ds);
    const dayLeaves=leaves.filter(l=>inRange(ds,l.start,l.end));
    const dayTasks=tasks.filter(t=>t.due===ds&&t.status!=='done');
    let inner=`<div class="cal-dn">${d}</div>`;
    dayLeaves.slice(0,1).forEach(l=>{const p=pById(l.person);inner+=`<span class="cal-tag" style="background:#e1f5ee;color:#085041">${p.label} 假</span>`;});
    dayTasks.slice(0,1).forEach(t=>{inner+=`<span class="cal-tag" style="background:#fcebeb;color:#a32d2d">${esc(t.title.length>7?t.title.slice(0,7)+'…':t.title)}</span>`;});
    dayEvts.slice(0,1).forEach(e=>{const[bg,fg]=ETYPES[e.type]||ETYPES.personal;inner+=`<span class="cal-tag" style="background:${bg};color:${fg}">${esc(e.title.length>7?e.title.slice(0,7)+'…':e.title)}</span>`;});
    const total=dayLeaves.length+dayTasks.length+dayEvts.length;
    if(total>2)inner+=`<span style="font-size:10px;color:var(--text2)">+${total-2}</span>`;
    html+=`<div class="cal-day${isToday?' today':''}${isSel?' selected':''}" onclick="selectDay('${ds}')">${inner}</div>`;
  }
  const remain=(7-((first+days)%7))%7;
  for(let i=1;i<=remain;i++)html+=`<div class="cal-day other-month"><div class="cal-dn">${i}</div></div>`;
  document.getElementById('cal-grid').innerHTML=html;
  if(selectedDay)showDayPanel(selectedDay);
}
function selectDay(ds){selectedDay=selectedDay===ds?null:ds;renderCal();if(!selectedDay)document.getElementById('day-panel').style.display='none';}
function showDayPanel(ds){
  const panel=document.getElementById('day-panel');
  const dayEvts=events.filter(e=>e.date===ds);
  const dayLeaves=leaves.filter(l=>inRange(ds,l.start,l.end));
  const dayTasks=tasks.filter(t=>t.due===ds&&t.status!=='done');
  if(!dayEvts.length&&!dayLeaves.length&&!dayTasks.length){panel.innerHTML=`<div class="day-panel"><b>${ds}</b><div style="font-size:13px;color:var(--text2);margin-top:6px">無行程或記錄</div></div>`;panel.style.display='block';return;}
  let html=`<div class="day-panel"><div style="font-size:13px;font-weight:500;margin-bottom:10px">${ds} 的記錄</div>`;
  if(dayTasks.length){
    html+=`<div style="font-size:12px;color:var(--text2);margin-bottom:6px;font-weight:500">交辦截止</div>`;
    dayTasks.forEach(t=>{const pf=pById(t.from),pt=pById(t.to),cf=pColor(t.from),ct=pColor(t.to);html+=`<div style="display:flex;align-items:center;gap:6px;margin-bottom:7px;flex-wrap:wrap"><span class="pill" style="background:#fcebeb;color:#a32d2d">截止</span><span style="font-size:13px;flex:1;min-width:80px">${esc(t.title)}</span><span class="nbadge" style="background:${cf.bg};color:${cf.fg}">${pf.label}</span><span style="font-size:11px;color:var(--text2)">→</span><span class="nbadge" style="background:${ct.bg};color:${ct.fg}">${pt.label}</span></div>`;});
  }
  if(dayLeaves.length){
    html+=`<div style="font-size:12px;color:var(--text2);margin:8px 0 6px;font-weight:500">請假</div>`;
    dayLeaves.forEach(l=>{const p=pById(l.person),c=pColor(l.person);html+=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><span class="nbadge" style="background:${c.bg};color:${c.fg}">${p.label}</span><span style="font-size:12px;color:var(--text2)">${l.note||'請假'}</span><button class="btn btn-sm btn-d" onclick="deleteLeave('${l.id}');renderCal()" style="margin-left:auto"><i class="ti ti-trash"></i></button></div>`;});
  }
  if(dayEvts.length){
    html+=`<div style="font-size:12px;color:var(--text2);margin:8px 0 6px;font-weight:500">行程</div>`;
    dayEvts.forEach(e=>{const[bg,fg,tl]=ETYPES[e.type]||ETYPES.personal;const p=e.person?pById(e.person):null;html+=`<div style="display:flex;align-items:flex-start;gap:8px;margin-bottom:6px"><span class="pill" style="background:${bg};color:${fg}">${tl}</span><div style="flex:1"><div style="font-size:13px">${esc(e.title)}</div>${p?`<div style="font-size:11px;color:var(--text2)">${p.label}</div>`:''}</div><button class="btn btn-sm btn-d" onclick="deleteEvent('${e.id}')"><i class="ti ti-trash"></i></button></div>`;});
  }
  html+='</div>'; panel.innerHTML=html; panel.style.display='block';
}

// ── 休假 ──
async function addLeave(){
  const person=document.getElementById('l-person').value;
  const start=document.getElementById('l-start').value;
  const end=document.getElementById('l-end').value;
  if(!start||!end){alert('請選擇日期');return;}
  if(end<start){alert('結束日不能早於開始日');return;}
  const obj={person,start,end,note:document.getElementById('l-note').value.trim()};
  if(API_URL){try{const r=await gasGet({action:'add',sheet:'請假',row:JSON.stringify(fromLeave(obj))});obj.id=r.id;}catch(e){alert('新增失敗: '+e.message);return;}}
  else{obj.id=Date.now().toString();}
  leaves.unshift(obj); saveLocal(); document.getElementById('l-note').value=''; renderLeave();
}
async function deleteLeave(id){
  if(API_URL){try{await gasGet({action:'delete',sheet:'請假',id})}catch(e){alert('刪除失敗');return;}}
  leaves=leaves.filter(l=>l.id!=id); saveLocal(); renderLeave();
}
function renderLeave(){
  const qd=document.getElementById('l-query').value;
  const onLeave=leaves.filter(l=>inRange(qd,l.start,l.end));
  let panel=`<div class="card"><div class="form-title" style="margin-bottom:8px">${qd} 出勤狀況</div><div class="leave-grid">`;
  PEOPLE.forEach(p=>{const absent=onLeave.find(l=>l.person===p.id);panel+=`<div class="leave-chip ${absent?'on-leave':'no-leave'}"><i class="ti ti-${absent?'beach':'user-check'}" style="font-size:14px;display:block;margin:0 auto 3px"></i>${p.label}</div>`;});
  panel+='</div></div>'; document.getElementById('leave-today').innerHTML=panel;
  const counts={};leaves.forEach(l=>{counts[l.person]=(counts[l.person]||0)+1});
  let fh=`<button class="fb${leaveFilter==='all'?' on':''}" onclick="setLF('all',this)">全部</button>`;
  PEOPLE.forEach(p=>{if(counts[p.id])fh+=`<button class="fb${leaveFilter===p.id?' on':''}" onclick="setLF('${p.id}',this)">${p.label}</button>`;});
  document.getElementById('leave-filters').innerHTML=fh;
  const list=leaveFilter==='all'?leaves:leaves.filter(l=>l.person===leaveFilter);
  document.getElementById('leave-body').innerHTML=list.length?list.map(l=>{
    const p=pById(l.person),c=pColor(l.person),days=dateDiff(l.start,l.end);
    return `<tr><td><span class="nbadge" style="background:${c.bg};color:${c.fg}">${p.label}</span></td><td style="font-size:12px">${l.start}</td><td style="font-size:12px">${l.end}</td><td style="font-size:12px">${days} 天</td><td style="font-size:12px;color:var(--text2)">${esc(l.note||'—')}</td><td><button class="btn btn-sm btn-d" onclick="deleteLeave('${l.id}')"><i class="ti ti-trash"></i></button></td></tr>`;
  }).join(''):`<tr><td colspan="6" class="empty">尚無請假記錄</td></tr>`;
}
function setLF(v,btn){leaveFilter=v;document.querySelectorAll('#leave-filters .fb').forEach(b=>b.classList.remove('on'));btn.classList.add('on');renderLeave();}

renderTasks(); renderCal(); renderLeave();
</script>
